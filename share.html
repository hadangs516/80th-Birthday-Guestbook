<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>초대장 카카오톡으로 보내기</title>
<style>
  :root {
    --paper: #fdf4e5;
    --ink: #3b2f1f;
    --muted: #75654f;
    --accent: #8a5c0e;
    --btn-bg: #fee500;
    --btn-ink: #191919;
    --error: #a31f17;
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--paper) url("bg.jpg") center / cover no-repeat;
    color: var(--ink);
    font-family: "Gowun Dodum", "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    font-size: 17px;
    line-height: 1.8;
    text-align: center;
    word-break: keep-all;
    display: grid;
    place-items: center;
    padding: 24px;
  }
  main { width: 100%; max-width: 420px; }
  h1 { font-family: "Nanum Myeongjo", "Noto Serif KR", "Batang", serif; font-size: 26px; line-height: 1.5; margin: 0 0 8px; }
  p { margin: 0 0 22px; color: var(--muted); }
  img { display: block; width: 100%; height: auto; border-radius: 24px; border: 4px solid #fffaf0; box-shadow: 0 10px 28px rgba(91, 64, 33, 0.2); margin: 0 0 26px; }
  button {
    width: 100%;
    font: inherit;
    font-weight: 700;
    background: var(--btn-bg);
    color: var(--btn-ink);
    border: 0;
    border-radius: 999px;
    padding: 15px 18px;
    cursor: pointer;
  }
  button:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
  button:disabled { opacity: 0.6; cursor: default; }
  .status { min-height: 1.8em; margin: 14px 0 0; font-size: 15px; color: var(--muted); }
  .status.error { color: var(--error); }
  .note { margin-top: 28px; font-size: 14px; }
</style>
<script src="https://t1.kakaocdn.net/kakao_js_sdk/2.8.4/kakao.min.js"></script>
</head>
<body>
<main>
  <h1>초대장 보내기</h1>
  <p>아래 버튼을 누르면 카카오톡이 열리고,<br>받을 분을 골라 초대 카드를 보낼 수 있습니다.</p>
  <img src="og-image.jpg" width="1200" height="600" alt="한광흡 장로 팔순 감사 찬양 예배 초대 카드 미리보기">
  <button type="button" id="send">카카오톡으로 초대장 보내기</button>
  <p class="status" id="status" role="status" aria-live="polite"></p>
  <p class="note">휴대폰에서 눌러야 카카오톡 앱이 바로 열립니다.</p>
</main>

<script>
(function () {
  var JS_KEY = '305a5776e2340c52afb58901da366ea5';
  var BASE = 'https://hadangs516.github.io/80th-Birthday-Guestbook/';
  var MAP = 'https://naver.me/xiLV4ZU1';
  var btn = document.getElementById('send');
  var statusEl = document.getElementById('status');

  function setStatus(text, isError) {
    statusEl.textContent = text;
    statusEl.className = 'status' + (isError ? ' error' : '');
  }

  try {
    if (window.Kakao && !Kakao.isInitialized()) Kakao.init(JS_KEY);
  } catch (e) { /* 아래에서 안내 */ }

  btn.addEventListener('click', function () {
    if (!window.Kakao || !Kakao.isInitialized()) {
      setStatus('카카오 공유 기능을 불러오지 못했습니다. 잠시 뒤에 다시 시도해 주세요.', true);
      return;
    }
    try {
      Kakao.Share.sendDefault({
        objectType: 'feed',
        content: {
          title: '한광흡 장로 팔순 감사 찬양 예배에 초대합니다',
          description: '2026년 12월 29일(화) 저녁 7시 · 성민교회',
          imageUrl: BASE + 'og-image.jpg',
          imageWidth: 1200,
          imageHeight: 600,
          link: { mobileWebUrl: BASE, webUrl: BASE }
        },
        buttons: [
          { title: '초대장 보기', link: { mobileWebUrl: BASE, webUrl: BASE } },
          { title: '위치보기', link: { mobileWebUrl: MAP, webUrl: MAP } }
        ]
      });
      setStatus('', false);
    } catch (e) {
      setStatus('보내지 못했습니다. (' + (e && e.message ? e.message : '오류') + ')', true);
    }
  });
})();
</script>
</body>
</html>
